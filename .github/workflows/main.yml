# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up Python
      uses: actions/setup-python@v7
    # Platform, toolchain and libraries (~/.platformio, .pio/libdeps) plus the compiled objects
    # (.pio/build) are reused between runs. The cache is several GB, so it is only saved again when
    # platformio.ini changes; changed sources are rebuilt anyway (SCons compares content hashes).
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
          .pio
        key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    # It is important to first install the libraries before compiling, since otherwise compilation might fail to find the just-installed libraries
    - name: Install platformIO libraries
      run: pio pkg install
    - name: Run PlatformIO
      run: platformio run
    - name: Upload firmware.bin
      uses: actions/upload-artifact@v7
      with:
        name: firmware
        path: |
          .pio/build/**/firmware.bin
          .pio/build/**/firmware.factory.bin

  # Pushes to main publish the firmware as a GitHub release tagged build-<commit>;
  # only the newest KEEP_RELEASES of these releases (and their tags) are kept
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_RELEASES: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: firmware
        path: firmware
    - name: Create release
      run: |
        sha=$(git rev-parse --short=7 HEAD)
        version=$(sed -n 's/.*FIRMWARE_VERSION = "\(.*\)";.*/\1/p' include/config.h)
        tag="build-$sha"
        dir=$(dirname "$(find firmware -name firmware.bin | head -1)")
        cp "$dir/firmware.bin" "gaszaehler-$sha-ota.bin"
        cp "$dir/firmware.factory.bin" "gaszaehler-$sha-factory.bin"
        cat > notes.md <<NOTES
        $(git log -1 --format=%s)

        - \`gaszaehler-$sha-ota.bin\`: update via the web UI (OTA)
        - \`gaszaehler-$sha-factory.bin\`: first flash over USB at offset 0x0, e.g. \`esptool.py write_flash 0x0 gaszaehler-$sha-factory.bin\`
        NOTES
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" gaszaehler-$sha-*.bin --clobber
        else
          gh release create "$tag" gaszaehler-$sha-*.bin --target "$GITHUB_SHA" \
            --title "$version ($sha)" --notes-file notes.md
        fi
    - name: Delete old releases
      run: |
        gh release list --limit 100 --json tagName,createdAt \
          --jq "[.[] | select(.tagName | startswith(\"build-\"))] | sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
        while read -r tag; do
          echo "Deleting release $tag"
          gh release delete "$tag" --yes --cleanup-tag
        done

  screenshots:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tools/screenshots/package-lock.json
    - name: Install Playwright
      working-directory: tools/screenshots
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Render TFT and web UI screenshots
      working-directory: tools/screenshots
      run: |
        npm run lcd -- --out "$RUNNER_TEMP/screenshots"
        npm run web -- --out "$RUNNER_TEMP/screenshots"
    - name: Upload screenshots
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: ${{ runner.temp }}/screenshots


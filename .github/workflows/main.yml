# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up Python
      uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    # It is important to first install the libraries before compiling, since otherwise compilation might fail to find the just-installed libraries
    - name: Install platformIO libraries
      run: pio pkg install
    - name: Run PlatformIO
      run: platformio run
    - name: Upload firmware.bin
      uses: actions/upload-artifact@v7
      with:
        name: firmware
        path: |
          .pio/build/**/firmware.bin

  screenshots:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tools/screenshots/package-lock.json
    - name: Install Playwright
      working-directory: tools/screenshots
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Render TFT and web UI screenshots
      working-directory: tools/screenshots
      run: |
        npm run lcd -- --out "$RUNNER_TEMP/screenshots"
        npm run web -- --out "$RUNNER_TEMP/screenshots"
    - name: Upload screenshots
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: ${{ runner.temp }}/screenshots


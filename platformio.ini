; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display]
platform = espressif32@^7.1.3
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
; Generates include/generated/web_index_html.h from web/index.html
extra_scripts = pre:scripts/embed_web.py
; Versions are pinned so that library updates cannot silently break the build
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    knolleary/PubSubClient@^2.8
    bodmer/TFT_eSPI@^2.5.43
    lennarthennigs/Button2@^2.7.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
  ;###############################################################
  ; TFT_eSPI library setting here (no need to edit library files):
  ;###############################################################
  -D USER_SETUP_LOADED=1                        ; Set this settings as valid
  -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h
  ;-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
  -D TOUCH_CS=-1
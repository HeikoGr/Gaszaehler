; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display]
; pioarduino: community-maintained platform with Arduino-ESP32 core 3.x
; (the official platformio/espressif32 platform only ships core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
; LittleFS on the "spiffs" partition of the default partition table
board_build.filesystem = littlefs
; Generates include/generated/web_index_html.h from web/index.html
extra_scripts = pre:scripts/embed_web.py
; Versions are pinned so that library updates cannot silently break the build
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    bertmelis/espMqttClient@^1.7.3
    lovyan03/LovyanGFX@^1.2.32
    lennarthennigs/Button2@^2.7.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17
; Pulled in by #includes inside #ifdef blocks (WiFiManager: mDNS, LovyanGFX: touch/I2C) but not
; used; ignoring them saves ~30 KB of flash
lib_ignore =
    ESPmDNS
    AsyncUDP
    Wire
